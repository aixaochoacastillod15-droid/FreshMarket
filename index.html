<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreshMarket S.L.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8fd;--s:#fff;--ink:#11273d;--mut:#586a7e;--p:#2c5d8a;--p2:#9bc7ee;--soft:#e2eefa;--ln:#d5e3f1;--ok:#1f7a5a;--er:#b3382c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1623;--s:#122338;--ink:#e6f0fa;--mut:#9fb3c8;--p:#7fb5e6;--p2:#2c5d8a;--soft:#183250;--ln:#25405e;--ok:#5fd3a3;--er:#ff8f82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1623;--s:#122338;--ink:#e6f0fa;--mut:#9fb3c8;--p:#7fb5e6;--p2:#2c5d8a;--soft:#183250;--ln:#25405e;--ok:#5fd3a3;--er:#ff8f82;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--s);z-index:30}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.1;margin:0}
h2{font-size:clamp(28px,4vw,42px);font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
h3{font-size:19px;font-weight:700}
p{margin:0 0 12px;max-width:68ch}
a{color:var(--p)}
.w{max-width:1140px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
.mut{color:var(--mut)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--s);border-bottom:1px solid var(--ln)}
.hb{display:flex;align-items:center;gap:18px;height:68px}
.logo img{height:44px;display:block}
:root[data-theme="dark"] .logo img,:root[data-theme="dark"] footer img{background:#fff;border-radius:8px;padding:3px 8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img,:root:not([data-theme="light"]) footer img{background:#fff;border-radius:8px;padding:3px 8px}}
nav{display:flex;gap:4px;margin-left:auto}
nav a{text-decoration:none;color:var(--ink);padding:8px 12px;border-radius:8px;font-weight:500;font-size:15px}
nav a:hover{background:var(--soft)}
.lg{display:flex;border:1px solid var(--ln);border-radius:999px;overflow:hidden}
.lg button{border:0;background:none;color:var(--ink);padding:6px 12px;font:600 13px Figtree,sans-serif;cursor:pointer}
.lg button.on{background:var(--p);color:#fff}
:root[data-theme="dark"] .lg button.on{color:#0b1623}
.cb{background:var(--p);color:#fff;border-radius:999px;padding:7px 14px;text-decoration:none;font-weight:600;font-size:14px;white-space:nowrap}
:root[data-theme="dark"] .cb{color:#0b1623}
.mb{display:none;border:1px solid var(--ln);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--p2);outline-offset:2px}
.hero{background:linear-gradient(135deg,#17406a,#2c5d8a 60%,#4f8fc9);color:#fff;padding:84px 0 72px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:56px solid rgba(155,199,238,.18)}
.hg{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center;position:relative;z-index:1}
.hero h1{font-size:clamp(38px,6vw,68px);font-weight:800;letter-spacing:-.03em;margin-bottom:18px}
.hero p{font-size:18px;color:#dbeafa}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.b{display:inline-block;border:0;border-radius:10px;padding:13px 22px;font:600 16px Figtree,sans-serif;cursor:pointer;text-decoration:none;background:var(--p);color:#fff}
:root[data-theme="dark"] .b{color:#0b1623}
.hero .b{background:#fff;color:#17406a}
.hero .b.o{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.7)}
.b.sm{padding:8px 14px;font-size:14px}
.cold{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:22px;backdrop-filter:blur(6px)}
.cold h3{margin-bottom:14px;font-size:17px}
.z{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid rgba(255,255,255,.2)}
.z strong{font:800 30px "Bricolage Grotesque",sans-serif;min-width:104px;letter-spacing:-.02em}
.z span{font-size:14px;color:#dbeafa;line-height:1.35}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:52px;border-top:1px solid rgba(255,255,255,.25);position:relative;z-index:1}
.stats div{padding:18px 16px 0 0}
.stats b{display:block;font:800 30px "Bricolage Grotesque",sans-serif}
.stats span{font-size:14px;color:#dbeafa}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.vals{display:grid;gap:0}
.vals div{padding:16px 0;border-top:1px solid var(--ln)}
.vals div:first-child{border-top:0;padding-top:0}
.vals p{margin:4px 0 0;color:var(--mut)}
.facts{background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:6px 22px}
.facts div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--ln)}
.facts div:last-child{border:0}
.facts span{color:var(--mut)}
.facts b{text-align:right}
.alt{background:var(--s);border-block:1px solid var(--ln)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 26px}
.chip{border:1px solid var(--ln);background:var(--s);color:var(--ink);padding:8px 16px;border-radius:999px;font:500 15px Figtree,sans-serif;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
:root[data-theme="dark"] .chip.on{color:#0b1623}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pc{background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px}
.pc .e{font-size:44px;line-height:1;background:var(--soft);border-radius:12px;width:72px;height:72px;display:grid;place-items:center;margin-bottom:8px}
.pc .pr{font:700 20px "Bricolage Grotesque",sans-serif;margin-top:6px}
.pc .b{margin-top:auto}
.ord{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.box{background:var(--s);border:1px solid var(--ln);border-radius:16px;padding:22px}
.ci{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.ci>div:first-child{flex:1}
.ci small{color:var(--mut);display:block}
.q{display:flex;align-items:center;gap:6px}
.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font-size:16px;cursor:pointer}
.tot{display:flex;justify-content:space-between;font:700 20px "Bricolage Grotesque",sans-serif;padding-top:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font:400 16px Figtree,sans-serif}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{padding:12px 14px;border-radius:10px;margin-top:14px;font-weight:500}
.msg.er{background:rgba(179,56,44,.12);color:var(--er)}
.msg.ok{background:rgba(31,122,90,.14);color:var(--ok)}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 36px;margin-top:24px}
.areas div{padding:16px 0;border-top:2px solid var(--p)}
.areas p{color:var(--mut);margin:6px 0 0}
table{border-collapse:collapse;width:100%;margin-top:8px}
td,th{padding:10px 6px;border-bottom:1px solid var(--ln);text-align:left}
td:last-child,th:last-child{text-align:right;font-weight:700}
.eco{background:linear-gradient(135deg,#17406a,#2c5d8a);color:#fff}
.eco p{color:#dbeafa}
.eco ul{margin:16px 0 0;padding-left:20px;color:#fff}
.eco li{margin:6px 0}
.ct{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:start}
.ct dl{margin:18px 0 0}
.ct dt{font-weight:700;margin-top:14px}
.ct dd{margin:2px 0 0;color:var(--mut)}
footer{border-top:1px solid var(--ln);padding:30px 0;color:var(--mut);font-size:14px}
footer .w{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer img{height:34px}
@media (max-width:860px){.hg,.split,.ord,.ct{grid-template-columns:1fr;gap:28px}.stats{grid-template-columns:1fr 1fr}.mb{display:block;margin-left:auto}nav{display:none;position:absolute;left:0;right:0;top:68px;background:var(--s);flex-direction:column;padding:10px 20px;border-bottom:1px solid var(--ln);margin:0}nav.open{display:flex}.hb .lg{margin-left:0}.r2{grid-template-columns:1fr}section{padding:52px 0}}
@media (max-width:520px){.cb{display:none}.logo img{height:36px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
